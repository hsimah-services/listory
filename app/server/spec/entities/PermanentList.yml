entity: PermanentList
description: A reusable template list whose items are copied into checklists.
use:
  - ListoryRecord
integrations:
  graphql:
    singular: ListoryList
    plural: ListoryLists
storage:
  table: permanent_list
  handle: listory_permanent_list
fields:
  title:
    type: string
    description: What the list is called.
    required: true
    indexed: true
    maxLength: 200
queries:
  search:
    description: Stable paginated title search with authoritative counts.
    args:
      term: { type: string, nullable: true }
    returns:
      type: PermanentList
      cardinality: many
    integrations:
      graphql:
        field: listoryListSearch
    handler: true
