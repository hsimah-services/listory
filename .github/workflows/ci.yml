name: CI

on:
  pull_request:
    branches: [master]

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          tools: composer
          coverage: none

      - uses: dtolnay/rust-toolchain@stable

      # Generators compile from source on composer build-generators; reuse them.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/vendor/elephentity/*/target
          key: ${{ runner.os }}-eleph-generators-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-eleph-generators-

      - name: Install locked PHP dependencies
        run: composer validate --strict && composer install --no-interaction --prefer-dist

      - name: Verify specs and generated code
        run: |
          composer build-generators
          composer check-generated
          git diff --exit-code -- spec generated

      - name: Server tests
        run: composer test

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Client checks
        run: npm ci && npm run check
